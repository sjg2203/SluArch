name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} tests and lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test,lint]'
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src tests
      - name: Check formatting
        run: python -m ruff format --check src tests docs/conf.py

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[release]'
          python -m build
          python -m twine check dist/*

  minimum-dependencies:
    name: Minimum supported dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install minimum supported dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'mne==1.6.0' 'numpy==1.25.0' 'scipy==1.12.0' 'pytest>=8'
          python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest

  docs:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[docs]'
      - name: Build documentation
        run: python -m sphinx --keep-going -b html docs docs/_build/html
