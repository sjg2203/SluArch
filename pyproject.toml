[project]
name = "sluarch"
version = "0.2.0"
description = "SlµArch (Sleep MicroArchitecture): open-source Python package to analyse sleep microarchitecture."
authors = [{ name = "Simon J. Guillot", email = "58807831+sjg2203@users.noreply.github.com" }]
maintainers = [{ name = "Simon J. Guillot", email = "58807831+sjg2203@users.noreply.github.com" }]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: Apache Software License",
	"Operating System :: Unix",
	"Operating System :: MacOS",
	"Operating System :: Microsoft :: Windows",
	"Programming Language :: Python :: 3 :: Only",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3.15",
]
dependencies = [
	"mne>=1.6.0",
	"numpy>=1.25.0",
	"scipy>=1.12.0",
]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/sjg2203/SluArch"
Repository = "https://github.com/sjg2203/SluArch"
Issues = "https://github.com/sjg2203/SluArch/issues"

[project.optional-dependencies]
test = ["pytest>=8"]
lint = ["ruff>=0.11"]
docs = ["myst-parser>=4", "sphinx>=8", "sphinx-autoapi>=3.6", "sphinx-rtd-theme>=3.0"]
release = ["build>=1.2", "twine>=6"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
changelog_file = "CHANGELOG.md"
build_command = "python -m pip install '.[release]' && python -m build"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "single"
indent-style = "tab"
docstring-code-format = true
